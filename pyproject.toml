[project]
name = "agentic-practice"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.10",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.7",
    "langchain-google-genai>=4.4.3",
    "langchain-ollama>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pydantic>=2.14.3",
    "pypdf>=7.0.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pytest>=9.2.0",
]
